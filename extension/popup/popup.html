<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unstuck Settings</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; margin: 0; padding: 16px; width: 320px; }
      label { display: block; font-size: 12px; font-weight: 600; margin-top: 10px; }
      input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; }
      button { margin-top: 12px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4f46e5; color: white; cursor: pointer; }
      .hint { font-size: 12px; color: #6b7280; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h3>Unstuck Voice Guide</h3>
    <label>OpenRouter API key</label>
    <input id="openRouterApiKey" type="password" placeholder="Optional" />
    <label>Groq API key</label>
    <input id="groqApiKey" type="password" placeholder="Optional" />
    <button id="save">Save settings</button>
    <div class="hint">Use OpenRouter for the best free model access; Groq is a fallback.</div>
    <script src="popup.js"></script>
  </body>
</html>
